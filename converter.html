<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Demo | Dynamic Currency Dashboard</title>
    <!-- We reuse your excellent style.css to keep themes consistent! -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <strong>Jason S. Belbestre | Labs</strong>
        <a href="index.html" style="color: var(--accent-color); text-decoration: none;">← Back to Portfolio</a>
    </nav>

    <section>
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Frontend Demo: Live Exchange Calculator</h2>
        <p style="text-align: center; color: #94a3b8; margin-bottom: 3rem;">Demonstrating JavaScript DOM Manipulation, Event Handling, and Client-Side Logic.</p>

        <!-- CALCULATOR CONTAINER CARD -->
        <div style="background-color: var(--card-bg); padding: 2.5rem; border-radius: 12px; border: 1px solid #334155; max-width: 500px; margin: 0 auto;">
            
            <!-- INPUT FIELD -->
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: #94a3b8;">Enter Amount:</label>
                <input type="number" id="amountInput" value="100" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 1.1rem; box-sizing: border-box;">
            </div>

            <!-- DROP-DOWN SELECTORS -->
            <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; color: #94a3b8;">From:</label>
                    <select id="fromCurrency" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: white;">
                        <option value="USD">USD (US Dollar)</option>
                        <option value="PHP">PHP (Philippine Peso)</option>
                        <option value="BTC">BTC (Bitcoin)</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="display: block; margin-bottom: 0.5rem; color: #94a3b8;">To:</label>
                    <select id="toCurrency" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: white;">
                        <option value="PHP" selected>PHP (Philippine Peso)</option>
                        <option value="USD">USD (US Dollar)</option>
                        <option value="BTC">BTC (Bitcoin)</option>
                    </select>
                </div>
            </div>

            <!-- INTERACTIVE BUTTON -->
            <button id="convertBtn" style="width: 100%; background-color: var(--accent-color); color: #0f172a; border: none; padding: 1rem; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">
                Calculate Exchange
            </button>

            <!-- DYNAMIC RESULT SCREEN -->
            <div id="resultDisplay" style="margin-top: 2rem; text-align: center; padding: 1rem; background-color: #0f172a; border-radius: 6px; border-left: 4px solid var(--accent-color);">
                <h3 id="resultText" style="margin: 0; font-size: 1.4rem; color: white;">100 USD = 5,600.00 PHP</h3>
            </div>
        </div>
    </section>

    <!-- LINK THE JAVASCRIPT BEHAVIOR FILE -->
    <script src="converter.js"></script>
</body>
</html>
