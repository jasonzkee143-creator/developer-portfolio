<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack Demo | Dynamic CRUD Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <strong>Jason S. Belbestre | DevLabs</strong>
        <a href="index.html" style="color: var(--accent-color); text-decoration: none;">← Back to Portfolio</a>
    </nav>

    <section style="max-width: 600px; margin: 0 auto; padding: 4rem 1rem;">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">CRUD Demo: Task Management System</h2>
        <p style="text-align: center; color: #94a3b8; margin-bottom: 3rem;">Demonstrating asynchronous database requests for creating, reading, updating, and deleting records.</p>

        <!-- TASK INPUT AREA -->
        <div style="background-color: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 2rem;">
            <form id="todoForm" style="display: flex; gap: 1rem;">
                <input type="text" id="taskInput" placeholder="Enter a new development task..." required style="flex: 1; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: white; box-sizing: border-box; font-size: 1rem;">
                <button type="submit" style="background-color: var(--accent-color); color: #0f172a; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; white-space: nowrap;">+ Add Task</button>
            </form>
        </div>

        <!-- TASK LIST DISPLAY WIREFRAME -->
        <div id="todoContainer">
            <p id="loadingText" style="text-align: center; color: #64748b;">Loading tasks from backend database environment...</p>
            <ul id="taskList" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1rem;">
                <!-- JavaScript will dynamically inject tasks right here! -->
            </ul>
        </div>
    </section>

    <script src="todo.js"></script>
</body>
</html>
